  // ---------- All interactions are wired exactly once ----------
  function onClick(event) {
    const b=event.target.closest('[data-act],[data-nav]');
    if (!b || b.disabled) return;
    if (b.dataset.nav) { go(b.dataset.nav); return; }
    const act=b.dataset.act, id=b.dataset.id, stageId=b.dataset.stage, optionId=b.dataset.option;
    const entity = (type) => state[type].find(x=>x.id===id);
    const archive = (type) => {
      const item=entity(type); if (!item) return;
      if (type === 'categories' && active(state.quests).some(q => [...(q.allocations || []), ...(q.links || [])].some(a => a.categoryId === id))) {
        toast('Kategorie ist noch Quests zugeordnet. Entferne diese Zuordnung zuerst, damit zukünftige Punkteberechnungen nicht unbemerkt wechseln.', true);
        return;
      }
      if (!confirm(`„${item.name}“ archivieren? Bestehende Punkte und Buchungen bleiben erhalten.`)) return;
      commit(s=>{ const entry=s[type].find(x=>x.id===id); entry.archivedAt=new Date().toISOString(); },'Archiviert.');
    };
    const restore = (type) => commit(s=>{
      const item=s[type].find(x=>x.id===id); if(!item) throw Error('Eintrag fehlt.');
      item.archivedAt=null;
      if(type==='quests') { item.penaltySince=today(); item.xpDecaySince=today(); }
    },'Wiederhergestellt.');
    switch (act) {
      case 'coach-start': case 'coach-edit': startCoach(); break;
      case 'coach-previous': ui.coachStep=Math.max(0,ui.coachStep-1);render(); break;
      case 'coach-cancel': ui.coachStep=-1;ui.coachDraft=null;render(); break;
      case 'coach-replan': replanOffline(); break;
      case 'coach-feedback': coachFeedback(b.dataset.rating); break;
      case 'coach-apply': coachApply(); break;
      case 'coach-ai': coachAI(); break;
      case 'close-modal': closeModal(); break;
      case 'new-category': modalCategory(); break;
      case 'edit-category': modalCategory(id); break;
      case 'archive-category': archive('categories'); break;
      case 'restore-category': restore('categories'); break;
      case 'new-quest': modalQuest(); break;
      case 'edit-quest': modalQuest(id); break;
      case 'archive-quest': archive('quests'); break;
      case 'restore-quest': restore('quests'); break;
      case 'quest-detail': go('quest-detail',{id}); break;
      case 'category-detail': go('category-detail',{id}); break;
      case 'toggle-archived': ui.showArchived=!ui.showArchived; render(); break;
      case 'log-quest': logQuest(id,today()); break;
      case 'open-manual': modalManual(); break;
      case 'delete-event': deleteEvent(id); break;
      case 'restore-event': restoreEvent([id]); break;
      case 'undo-last': undoLast(); break;
      case 'new-special': modalSpecial(); break;
      case 'edit-special': modalSpecial(id); break;
      case 'archive-special': archive('specials'); break;
      case 'restore-special': restore('specials'); break;
      case 'complete-special': completeSpecial(id); break;
      case 'new-mission': modalMission(); break;
      case 'edit-mission': modalMission(id); break;
      case 'mission-detail': go('mission-detail',{id}); break;
      case 'archive-mission': archive('missions'); break;
      case 'restore-mission': restore('missions'); break;
      case 'add-stage': modalStage(id); break;
      case 'add-option': modalStage(id,stageId); break;
      case 'edit-option': modalStage(id,stageId,optionId); break;
      case 'delete-stage': deleteStage(id,stageId); break;
      case 'delete-option': deleteOption(id,stageId,optionId); break;
      case 'complete-stage': completeStage(id,stageId,optionId); break;
      case 'new-reward': modalReward(); break;
      case 'edit-reward': modalReward(id); break;
      case 'archive-reward': archive('rewards'); break;
      case 'restore-reward': restore('rewards'); break;
      case 'redeem-reward': redeemReward(id); break;
      case 'export': exportState(); break;
      case 'reset-all': resetAll(); break;
      case 'reset-log': resetLog(); break;
      case 'archive-all': archiveAll(b.dataset.type); break;
      default: console.warn('Unbekannte Aktion',act);
    }
  }
  function onSubmit(event) {
    const form=event.target.closest('form[data-form]');
    if (!form) return;
    event.preventDefault();
    const type=form.dataset.form, id=form.dataset.id;
    const data=new FormData(form);
    const str=(name)=>C.normalizeName(data.get(name));
    const asNum=(name)=>Number(data.get(name));
    const checked=(name)=>data.get(name)==='on';
    if(type==='coach-step'){
      const draft=ui.coachDraft||coachDefaultProfile();
      const pick=(key)=>data.get(key);
      if(ui.coachStep===0){Object.assign(draft,{goal:pick('goal'),level:pick('level'),days:Number(pick('days')),minutes:Number(pick('minutes'))});}
      if(ui.coachStep===1){draft.equipment=data.getAll('equipment');draft.schedule=data.getAll('schedule').map(Number);draft.restrictions=String(pick('restrictions')||'');}
      if(ui.coachStep===2){Object.assign(draft,{diet:pick('diet'),meals:Number(pick('meals')),prepMinutes:Number(pick('prepMinutes')),fridge:pick('fridge')==='yes',budget:pick('budget')});}
      if(ui.coachStep===3){Object.assign(draft,{foodAvailable:String(pick('foodAvailable')||''),foodAvoid:String(pick('foodAvoid')||''),weightKg:pick('weightKg')||null,weekNotes:String(pick('weekNotes')||'')});}
      ui.coachDraft=draft;
      if(ui.coachStep<3){ui.coachStep++;render();window.scrollTo(0,0);return;}
      try{const profile=Coach.normalizeProfile(draft);
        if(commit(s=>{const c=s.coaches.sport;c.profile=profile;c.plan=Coach.generateLocalPlan(profile,c.feedback,()=>C.uid('coach'));},'Dein Trainings- und Ernährungsplan ist erstellt.')){
          ui.coachStep=-1;ui.coachDraft=null;render();window.scrollTo(0,0);
        }
      }catch(e){toast(e.message,true);}
      return;
    }
    if(type==='coach-api'){
      const apiUrl=String(data.get('apiUrl')||'').trim().replace(/\/$/,'');
      if(apiUrl){try{const u=new URL(apiUrl);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('HTTPS erforderlich.');}catch(e){return toast('Bitte eine gültige HTTPS-Adresse angeben.',true);}}
      commit(s=>{s.coaches.sport.apiUrl=apiUrl;},'Server-Adresse gespeichert.');return;
    }
    if (type==='log-quest') {
      const qid=str('questId');
      const override=str('pointsOverride');
      ui.logDate=str('date')||today();
      logQuest(qid,ui.logDate,override===''?undefined:Number(override));
      return;
    }
    if (type==='category') {
      const name=str('name'); if (!name) return toast('Name erforderlich.',true);
      const other=active(state.categories).find(c=>c.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de') && c.id!==id);
      if (other) return toast('Diese Kategorie gibt es bereits.',true);
      const color=C.safeColor(str('color')),type=str('type');
      if (commit(s=>{
        const cat = id ? s.categories.find(c=>c.id===id) : null;
        if(id&&!cat) throw Error('Kategorie nicht gefunden.');
        if(cat){ if(cat.system) throw Error('Systemkategorie kann nicht verändert werden.'); Object.assign(cat,{name,color,type}); }
        else s.categories.push({id:C.uid('cat'),name,color,type,archivedAt:null});
      },id?'Kategorie gespeichert.':'Kategorie angelegt.')) closeModal();
      return;
    }
    if (type==='quest') {
      const name=str('name'),points=asNum('points');
      if (!name||!(points>0)||points>100000) return toast('Name und gültige Punkte angeben.',true);
      if (active(state.quests).some(q=>q.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de') && q.id!==id)) return toast('Questname bereits vorhanden.',true);
      let allocations,links;
      try { allocations=readAllocations(form,'categoryPick'); links=readAllocations(form,'linkPick'); }
      catch(e){ return toast(e.message,true); }
      if (links.some(l=>allocations.some(a=>a.categoryId===l.categoryId))) return toast('Eine Kategorie nicht doppelt zuweisen (oben und Zusatzwirkung).',true);
      const pEnabled=checked('penaltyEnabled'),pDays=asNum('penaltyDays'),pPts=asNum('penaltyPoints'),pRepeat=asNum('penaltyRepeatDays');
      if(pEnabled&&(!Number.isInteger(pDays)||pDays<1||!Number.isFinite(pPts)||pPts<0||!Number.isInteger(pRepeat)||pRepeat<1)) return toast('Ungültige Inaktivitätsregeln.',true);
      const sEnabled=checked('streakEnabled'),xEnabled=checked('xpDecayEnabled');
      const now=today();
      if(commit(s=>{
        let q=id?s.quests.find(q=>q.id===id):null;
        if(id&&!q) throw Error('Quest nicht gefunden.');
        if(!q){q={id:C.uid('quest'),createdOn:now,archivedAt:null,penaltySince:now,xpDecaySince:now}; s.quests.push(q);}
        const changedPenalty=q.penaltyEnabled!==pEnabled||q.penaltyDays!==pDays||q.penaltyPoints!==pPts||q.penaltyRepeatDays!==pRepeat;
        if(changedPenalty) q.penaltySince=now;
        if(!q.xpDecayEnabled&&xEnabled) q.xpDecaySince=now;
        Object.assign(q,{name,points,isBoss:str('isBoss')==='1',allocations,links,
          penaltyEnabled:pEnabled,penaltyDays:pEnabled?pDays:0,penaltyPoints:pEnabled?pPts:0,
          penaltyRepeatDays:pEnabled?pRepeat:0,streakEnabled:sEnabled,xpDecayEnabled:xEnabled});
      },id?'Quest gespeichert.':'Quest angelegt.')) closeModal();
      return;
    }
    if (type==='special') {
      const name=str('name'),points=asNum('points'),days=asNum('cooldownDays'),initial=str('initialLockUntil');
      if(!name||!(points>0)||!Number.isInteger(days)||days<1||days>3650) return toast('Name, Punkte und Cooldown prüfen.',true);
      if(initial&&!C.isISODate(initial)) return toast('Ungültiges Startdatum.',true);
      let allocations;
      try{allocations=readAllocations(form,'categoryPick');}catch(e){return toast(e.message,true);}
      if(commit(s=>{
        let item=id?s.specials.find(x=>x.id===id):null;
        if(id&&!item) throw Error('Sonderaufgabe fehlt.');
        if(!item){item={id:C.uid('special'),createdOn:today(),archivedAt:null};s.specials.push(item);}
        Object.assign(item,{name,points,cooldownDays:days,initialLockUntil:initial||null,allocations});
      },id?'Sonderaufgabe gespeichert.':'Sonderaufgabe angelegt.')) closeModal();
      return;
    }
    if (type==='mission') {
      const name=str('name'),description=str('description');
      if(!name) return toast('Missionsname erforderlich.',true);
      if(commit(s=>{
        let item=id?s.missions.find(x=>x.id===id):null;
        if(id&&!item) throw Error('Mission fehlt.');
        if(!item){item={id:C.uid('mission'),createdOn:today(),archivedAt:null,stages:[]};s.missions.push(item);}
        item.name=name; item.description=description;
      },id?'Mission gespeichert.':'Mission angelegt.')) closeModal();
      return;
    }
    if (type==='stage') {
      const mId=id,stageId=form.dataset.stage,optionId=form.dataset.option;
      const name=str('name'),points=asNum('points');
      if(!name||!(points>0)) return toast('Aufgabenname und Punkte erforderlich.',true);
      const mp=currentView().missionProgress[mId];
      if(mp?.completed) return toast('Abgeschlossene Missionen können nicht verändert werden. Zuerst Log-Einträge rückgängig machen.',true);
      if(stageId&&mp?.stages[stageId]) return toast('Erledigte Stufen nicht nachträglich verändern.',true);
      if(commit(s=>{
        const mission=s.missions.find(m=>m.id===mId); if(!mission) throw Error('Mission fehlt.');
        let stage=stageId?mission.stages.find(x=>x.id===stageId):null;
        if(stageId&&!stage) throw Error('Stufe fehlt.');
        if(!stage){stage={id:C.uid('stage'),options:[]};mission.stages.push(stage);}
        let option=optionId?stage.options.find(x=>x.id===optionId):null;
        if(optionId&&!option) throw Error('Option fehlt.');
        if(!option){option={id:C.uid('opt')};stage.options.push(option);}
        option.name=name;option.points=points;
      },optionId?'Aufgabe gespeichert.':stageId?'Alternative angelegt.':'Stufe angelegt.')) closeModal();
      return;
    }
    if (type==='reward') {
      const name=str('name'),cost=asNum('cost');
      if(!name||!Number.isInteger(cost)||cost<1) return toast('Name und gültige Punktekosten erforderlich.',true);
      if(commit(s=>{
        let item=id?s.rewards.find(x=>x.id===id):null;
        if(id&&!item) throw Error('Belohnung fehlt.');
        if(!item){item={id:C.uid('reward'),archivedAt:null};s.rewards.push(item);}
        item.name=name;item.cost=cost;
      },id?'Belohnung gespeichert.':'Belohnung angelegt.')) closeModal();
      return;
    }
    if (type==='manual') {
      const name=str('name'),points=asNum('points'),date=str('date');
      if(!name||!Number.isFinite(points)||!C.isISODate(date)||date>today()) return toast('Beschreibung, Punkte und Datum prüfen.',true);
      if(commit(s=>s.events.push(C.newManualEvent(date,name,points)),'Freier Eintrag gespeichert.')) closeModal();
      return;
    }
    if (type==='settings') {
      const conf={};
      for (const key of ['euroPerPoint','dailyGoal','levelBase','levelGrowth','negativeFactor','streakStep','streakCap','questXpDecay']) conf[key]=asNum(key);
      if(Object.values(conf).some(x=>!Number.isFinite(x))||conf.euroPerPoint<0||conf.dailyGoal<1||conf.levelBase<10||conf.levelGrowth<0||conf.levelGrowth>1||conf.negativeFactor<1||conf.streakStep<0||conf.streakCap<1||conf.questXpDecay<0) return toast('Ungültige Einstellungswerte.',true);
      commit(s=>Object.assign(s.settings,conf),'Einstellungen gespeichert.');
      return;
    }
    if (type==='chat') {
      const message=str('message');
      if(!message) return;
      chatSend(message);
      return;
    }
  }

  $('#backBtn').addEventListener('click',back);
  $('#homeBtn').addEventListener('click',home);
  $('#themeBtn').addEventListener('click',()=>commit(s=>{s.settings.theme=s.settings.theme==='dark'?'light':'dark';},'Design gewechselt.'));

  // ---------- State-changing commands ----------
  function validDate(d){return C.isISODate(d)&&d<=today();}
  function logQuest(id, date = today(), override) {
    const q=questById(id);
    if(!q||q.archivedAt) return toast('Quest nicht gefunden oder archiviert.',true);
    if(!validDate(date)) return toast('Das Datum darf nicht in der Zukunft liegen.',true);
    if(override!==undefined && (!Number.isFinite(override)||override<=0||override>100000)) return toast('Ungültige Punktzahl.',true);
    commit(s=>{ const item=s.quests.find(x=>x.id===id);s.events.push(C.newQuestEvent(s,item,date,override));},`„${q.name}“ gebucht.`);
  }
  function completeSpecial(id) {
    const s=state.specials.find(x=>x.id===id), date=today();
    const eligibility=C.canCompleteSpecial(state,currentView(),s,date);
    if(!eligibility.ok) return toast(eligibility.reason,true);
    commit(d=>{ const item=d.specials.find(x=>x.id===id);d.events.push(C.newSpecialEvent(d,item,date));},`„${s.name}“ erledigt.`);
  }
  function completeStage(id,stageId,optionId) {
    const m=state.missions.find(x=>x.id===id),stage=m?.stages.find(x=>x.id===stageId),opt=stage?.options.find(x=>x.id===optionId);
    if(!opt) return toast('Aufgabe fehlt.',true);
    const eligibility=C.canCompleteMissionStage(state,currentView(),m,stage,today());
    if(!eligibility.ok) return toast(eligibility.reason,true);
    commit(s=>s.events.push(C.newMissionEvent(m,stage,opt,today())),`Stufe abgeschlossen. ${m.stages.at(-1).id===stageId?'Missionsbonus automatisch berechnet.':''}`);
  }
  function deleteStage(id,stageId) {
    const m=state.missions.find(x=>x.id===id);
    if(!m||currentView().missionProgress[id]?.stages[stageId]) return toast('Erledigte Stufen nicht entfernen.',true);
    const later=m.stages.slice(m.stages.findIndex(s=>s.id===stageId)+1);
    if(later.some(s=>currentView().missionProgress[id]?.stages[s.id])) return toast('Spätere Stufen sind schon erledigt.',true);
    if(!confirm('Diese Stufe und ihre alternativen Aufgaben entfernen?')) return;
    commit(s=>{const mission=s.missions.find(m=>m.id===id);mission.stages=mission.stages.filter(st=>st.id!==stageId);},'Stufe entfernt.');
  }
  function deleteOption(id,stageId,optionId) {
    const m=state.missions.find(x=>x.id===id),stage=m?.stages.find(x=>x.id===stageId);
    if(!stage||stage.options.length<=1||currentView().missionProgress[id]?.stages[stageId]) return toast('Option kann nicht entfernt werden.',true);
    if(!confirm('Alternative entfernen?')) return;
    commit(s=>{const st=s.missions.find(m=>m.id===id).stages.find(st=>st.id===stageId);st.options=st.options.filter(o=>o.id!==optionId);},'Alternative entfernt.');
  }
  function deleteEvent(id) {
    const event=state.events.find(e=>e.id===id&&!e.voidedAt);
    if(!event)return;
    if(!confirm(`Buchung „${event.snapshot?.name||'Eintrag'}“ rückgängig machen? Bei Missionsschritten werden auch spätere Stufen dieser Mission zurückgenommen.`))return;
    let removed=[];
    if(commit(s=>{removed=C.voidEvent(s,id);if(!removed.length)throw Error('Buchung fehlt.');},'Buchung rückgängig.'))ui.undoIds=removed;
  }
  function undoLast() {
    const e=state.events.filter(e=>!e.voidedAt).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))||b.id.localeCompare(a.id))[0];
    if(!e)return toast('Keine aktive Buchung vorhanden.',true);
    let removed=[];
    if(commit(s=>{removed=C.voidEvent(s,e.id);},'Letzte Buchung rückgängig.'))ui.undoIds=removed;
  }
  function restoreEvent(ids) {
    if(commit(s=>{ const count=C.restoreEvents(s,ids).length;if(!count)throw Error('Nichts zum Wiederherstellen.');},'Buchung wiederhergestellt.'))ui.undoIds=[];
  }
  function redeemReward(id) {
    const reward=state.rewards.find(r=>r.id===id&&!r.archivedAt);
    if(!reward) return toast('Belohnung nicht vorhanden.',true);
    if(currentView().points<reward.cost)return toast('Nicht genügend Punkte.',true);
    if(!confirm(`„${reward.name}“ für ${number(reward.cost)} Punkte einlösen?`))return;
    commit(s=>s.events.push(C.newRedeemEvent(today(),reward)),'Belohnung eingelöst.');
  }
  function archiveAll(type) {
    const valid=['quests','specials','missions','rewards','categories'];
    if(!valid.includes(type))return;
    if (type === 'categories' && active(state.quests).some(q => [...(q.allocations || []), ...(q.links || [])].some(a => a.categoryId !== C.MISC_ID))) {
      return toast('Aktive Quests verwenden noch Kategorien. Bearbeite diese Quests zuerst; ein automatischer Wechsel des Punktsystems wäre riskant.', true);
    }
    if(!confirm(`Alle aktiven ${type==='categories'?'eigenen Kategorien':type} archivieren? Vorhandene Buchungen bleiben erhalten.`))return;
    commit(s=>{ for(const x of s[type])if(!x.system)x.archivedAt=new Date().toISOString(); },'Bereich archiviert.');
  }
  function exportState() { downloadFile(`life-rpg-backup-${today()}.json`,JSON.stringify(state,null,2),'application/json');toast('Backup erstellt.'); }
  function downloadFile(filename,content,type) {
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }
  async function importState(file) {
    if(!file)return;
    try {
      if(file.size>15*1024*1024)throw Error('Backup ist zu groß (maximal 15 MB).');
      const raw=await file.text(),incoming=C.normalizeState(JSON.parse(raw));
      if(!confirm(`Backup importieren? Es enthält ${incoming.events.length} Aktionen und ${incoming.quests.length} Quests. Der aktuelle Stand wird ersetzt; vorher wird eine Sicherheitskopie heruntergeladen.`))return;
      exportState();
      localStorage.setItem(C.STORAGE_KEY,JSON.stringify(incoming));
      state=incoming;snapshot=null;stack=[];route={name:'menu',params:{}};closeModal();applyTheme();render();
      toast('Backup vollständig importiert.');
    } catch(e){toast('Import fehlgeschlagen: '+e.message,true);}
  }
  function resetLog() {
    if(prompt('Alle Buchungen inklusive aller Punkte und Missionsabschlüsse löschen? Zum Bestätigen VERLAUF eingeben:')!=='VERLAUF')return;
    exportState();
    commit(s=>{s.events=[];},'Buchungen zurückgesetzt.');
  }
  function resetAll() {
    if(prompt('Kompletter Neustart: Alle Daten unwiderruflich überschreiben. Zum Bestätigen LÖSCHEN eingeben:')!=='LÖSCHEN')return;
    exportState();
    try {
      const fresh=C.newState(today());localStorage.setItem(C.STORAGE_KEY,JSON.stringify(fresh));
      state=fresh;snapshot=null;stack=[];ui.undoIds=[];route={name:'menu',params:{}};
      applyTheme();render();toast('Neuer leerer Stand angelegt.');
    }catch(e){toast('Neustart fehlgeschlagen: '+e.message,true);}
  }
  function chatSend(message) {
    const view=currentView();
    ui.chat.push({me:true,text:message});
    const msg=message.trim(),lower=msg.toLocaleLowerCase('de');
    let answer;
    if(['hilfe','/help','help','?'].includes(lower))answer='Befehle:\n• Punkte – aktueller Stand\n• Level – Levelstatus\n• Fällig – dringende Aufgaben\n• /log QUESTNAME – passende Quest jetzt eintragen\n• /log kann nur existierende aktive Quests buchen.';
    else if(/punkte|punktestand|sparstand|kontostand/.test(lower))answer=`Aktuell: ${number(view.points)} Punkte, ${money(view.savings)} Sparstand.`;
    else if(/level|lvl/.test(lower))answer=`Du bist Level ${view.level.level}. Es fehlen ${number(view.level.need-view.level.remaining)} XP bis Level ${view.level.level+1}.`;
    else if(/fällig|offen|heute/.test(lower)) {
      const due=C.dueItems(state,view,today()).filter(x=>x.daysLeft<=0).slice(0,6);
      answer=due.length?due.map(d=>`${d.name} (${d.daysLeft<0?'überfällig':'heute'})`).join('\n'):'Keine dringenden Aufgaben.';
    } else if(lower.startsWith('/log ')){
      const name=C.normalizeName(msg.slice(5));
      const q=active(state.quests).find(q=>q.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'));
      if(!q)answer=`Quest „${name}“ nicht gefunden. Verwende den exakten Namen aus dem Katalog.`;
      else {const ok=commit(s=>s.events.push(C.newQuestEvent(s,s.quests.find(x=>x.id===q.id),today())));answer=ok?`„${q.name}“ für heute eingetragen.`:'Speichern war nicht möglich.';}
    } else answer='Das habe ich nicht erkannt. Schreibe „Hilfe“ für die verfügbaren Befehle.';
    ui.chat.push({me:false,text:answer});
    render();
    const chat=$('#chatBox');if(chat)chat.scrollTop=chat.scrollHeight;
    $('#chatInput')?.focus();
  }
  boot();
})();

</script>
</body>
</html>
